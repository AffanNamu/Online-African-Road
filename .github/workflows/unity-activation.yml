# ONE-TIME SETUP for Unity CI (no local Unity install needed). See docs/BUILD.md.
# 1. Run this workflow (Actions > Unity license activation > Run workflow); download the "Manual Activation File" artifact (.alf).
# 2. Upload the .alf at https://license.unity3d.com/manual, choose "Unity Personal", download the .ulf.
# 3. Add repo secrets: UNITY_LICENSE (full contents of the .ulf), UNITY_EMAIL, UNITY_PASSWORD. Add repo variable UNITY_CI_ENABLED=true.
name: Unity license activation
on: workflow_dispatch
jobs:
  request:
    runs-on: ubuntu-latest
    steps:
      - uses: game-ci/unity-request-activation-file@v2
        id: request
        with: { unityVersion: 6000.0.58f2 }
      - uses: actions/upload-artifact@v4
        with: { name: Manual Activation File, path: "${{ steps.request.outputs.filePath }}" }
