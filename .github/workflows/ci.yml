name: CI
on:
  workflow_dispatch:
  push:
    branches: ['**']
    paths-ignore: ['docs/**', '**/*.md']   # docs-only commits should not spend ~15 min of Unity CI
  pull_request:
    paths-ignore: ['docs/**', '**/*.md']

jobs:
  sql:
    name: Database migrations + rule tests
    runs-on: ubuntu-latest
    env: { PGHOST: localhost, PGUSER: postgres, PGPASSWORD: postgres }
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/postgres
      - name: Rule, security-matrix and concurrency tests
        run: ./supabase/tests/run.sh
      - name: Generated seeds are up to date with the authored data (world map, news, hero)
        run: python3 tools/gen_game_seed.py --check
      - name: Upgrade test (a database with players, money and a convoy is migrated by the real apply.sh; nothing is lost)
        run: bash supabase/tests/40_upgrade.sh
      - name: Job board top-up script (cold start, steady top-up, the cap, expired and closed jobs not counted, a foreign database refused)
        run: bash supabase/tests/49_top_up_jobs.sh
      - name: API contract (every C# DTO the client parses versus the real output of the real RPCs)
        run: python3 tools/check_api_contract.py
      - name: Mutation test (every protection must be caught by a test)
        run: python3 supabase/tests/mutation.py

  api-e2e:
    name: Backend over HTTP (PostgREST + auth + security tests)
    runs-on: ubuntu-latest
    env: { PGHOST: localhost, PGUSER: postgres, PGPASSWORD: postgres }
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/postgres
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Install PostgREST
        run: tools/e2e/install_postgrest.sh
      - name: Start the backend (fresh database, every migration, PostgREST, auth shim)
        run: tools/e2e/up.sh
      - name: HTTP end-to-end and security tests
        run: |
          source /tmp/aro-e2e.env
          node tools/e2e/api_e2e.js
      - name: Admin site end to end (real database, migrations and PostgREST; the auth service is a stand-in with real TOTP)
        run: |
          source /tmp/aro-e2e.env
          npm install --no-save playwright@1.49.1
          npx playwright install --with-deps chromium
          node tools/admin_e2e.js
      - name: Backend logs
        if: failure()
        run: tail -n 80 /tmp/aro-e2e-postgrest.log /tmp/aro-e2e-shim.log || true

  safety:
    name: Repository safety gate (secrets, licences, third-party assets)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: The gate catches what it claims to catch
        run: python3 tools/test_repo_safety.py
      - name: Scan every tracked file
        run: python3 tools/check_repo_safety.py

  netcore:
    name: Network core logic (.NET unit tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: '8.0.x' }
      - run: dotnet test tests/NetCore.Tests/NetCore.Tests.csproj --logger "trx;LogFileName=netcore.trx"
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: netcore-test-results, path: tests/NetCore.Tests/TestResults/*.trx }

  unity:
    name: Unity tests + WebGL build
    runs-on: ubuntu-latest
    # Needs repository secrets UNITY_LICENSE (the .ulf contents), UNITY_EMAIL and UNITY_PASSWORD (a Unity ID WITH a password, no 2FA). Run 'Unity license check' first: it tells you if the secrets look right.
    if: ${{ vars.UNITY_CI_ENABLED == 'true' }}
    # One Unity activation at a time (a Personal serial has a small seat limit).
    concurrency: { group: unity-license, cancel-in-progress: false }
    # The test runner publishes its results as a check run (run 27: 'Resource not accessible by integration' without this).
    permissions: { contents: read, checks: write }
    steps:
      - uses: actions/checkout@v4
        with: { lfs: true }
      # Unity 6 does not accept the Hub .ulf by itself in CI (run 26: 'com.unity.editor.headless was not found'; license debug run:
      # .ulf-only and -manualLicenseFile fail, serial + account login succeeds). The .ulf carries the Personal serial in its
      # DeveloperData field, so recover it here (masked) and let GameCI activate with serial + email + password.
      - name: Derive Unity serial from the license file (masked)
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
        run: |
          python3 - <<'PY'
          import os, re, base64
          lic = os.environ["UNITY_LICENSE"]
          m = re.search(r'DeveloperData Value="([^"]+)"', lic)
          serial = ""
          if m:
              s = re.search(rb"[A-Za-z0-9]{2}(?:-[A-Za-z0-9]{4}){5}", base64.b64decode(m.group(1)))
              if s: serial = s.group(0).decode()
          if not serial:
              raise SystemExit("UNITY_LICENSE has no serial-backed DeveloperData; see docs/BUILD.md")
          print("::add-mask::" + serial)
          print("::add-mask::" + serial[:-5])   # Unity itself logs the serial with the last group replaced by XXXX
          with open(os.environ["GITHUB_ENV"], "a") as f: f.write("UNITY_SERIAL=" + serial + "\n")
          print("serial recovered (masked)")
          PY
      # Optional: set repo secrets DOCKERHUB_USERNAME / DOCKERHUB_TOKEN to avoid Docker Hub anonymous pull limits
      # when pulling the (large) unityci/editor image. Skipped when absent.
      - name: Docker Hub login (optional)
        env: { DH_USER: "${{ secrets.DOCKERHUB_USERNAME }}", DH_TOKEN: "${{ secrets.DOCKERHUB_TOKEN }}" }
        run: |
          if [ -n "$DH_USER" ] && [ -n "$DH_TOKEN" ]; then echo "$DH_TOKEN" | docker login -u "$DH_USER" --password-stdin; else echo "no Docker Hub credentials; using anonymous pulls"; fi
      # Docker Hub is flaky/throttled for anonymous pulls from shared runners (toomanyrequests, auth.docker.io timeouts).
      # Pre-pull the exact images GameCI will use, with retries + backoff, so game-ci finds them locally.
      - name: Pre-pull Unity editor images (retry with backoff)
        run: |
          for img in unityci/editor:ubuntu-6000.0.58f2-linux-il2cpp-3 unityci/editor:ubuntu-6000.0.58f2-webgl-3; do
            ok=0
            for i in 1 2 3 4 5 6 7 8; do
              if docker pull "$img"; then ok=1; break; fi
              echo "pull of $img failed (attempt $i); sleeping $((i*30))s"; sleep $((i*30))
            done
            [ "$ok" = 1 ] || { echo "could not pull $img after retries"; exit 1; }
          done
      - uses: actions/cache@v4
        with:
          path: Library
          key: Library-${{ hashFiles('Packages/manifest.json', 'ProjectSettings/ProjectVersion.txt') }}
      - uses: game-ci/unity-test-runner@v4
        env:
          UNITY_SERIAL: ${{ env.UNITY_SERIAL }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with: { testMode: editmode }
      - uses: game-ci/unity-builder@v4
        env:
          UNITY_SERIAL: ${{ env.UNITY_SERIAL }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          targetPlatform: WebGL
          buildMethod: ARO.Editor.BuildScript.BuildWebGL
          versioning: None   # semantic versioning refuses a dirty tree, and Unity just generated untracked .meta files (run 28)
          # Bake the backend into the player when configured (repo variable SUPABASE_URL + secret SUPABASE_ANON_KEY, the PUBLIC anon key only).
          customParameters: ${{ secrets.SUPABASE_ANON_KEY != '' && format('-supabaseUrl {0} -supabaseAnonKey {1}', vars.SUPABASE_URL || secrets.SUPABASE_URL || 'https://echmdzqxlbiszyeawbcd.supabase.co', secrets.SUPABASE_ANON_KEY) || '' }}
      # PRIVATE-ASSET BOUNDARY (docs/ASSET_PIPELINE_PLAN.md section 10): artifacts and published screenshots of a PUBLIC repository are readable by anyone signed in to GitHub. When the repository variable
      # ASSETS_REPO is set (private assets are being fetched into the build), nothing built from them is uploaded or published; the steps below that need the build then fail, which is the safe direction.
      - uses: actions/upload-artifact@v4
        if: ${{ vars.ASSETS_REPO == '' }}
        with: { name: webgl-build, path: Builds/WebGL, if-no-files-found: error }   # BuildScript writes Builds/WebGL (run 29: the old path build/WebGL was empty)

  webgl-smoke:
    name: WebGL build boots in a browser
    needs: unity
    runs-on: ubuntu-latest
    timeout-minutes: 120      # the browser suite takes about 40 minutes; a hang (run 39191975590 sat in one step for 6 hours until GitHub's limit) now fails in two hours
    if: ${{ vars.UNITY_CI_ENABLED == 'true' }}
    permissions: { contents: write }   # only to publish screenshots to the ci-screenshots branch
    env: { PGHOST: localhost, PGUSER: postgres, PGPASSWORD: postgres }
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/postgres
      - uses: actions/download-artifact@v4
        with: { name: webgl-build, path: Builds/WebGL }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: WebGL build size budget (desktop 120 MB, mobile 80 MB; mirrors PerfBudget in NetCore)
        run: |
          ls -la Builds/WebGL/Build || true
          total=$(du -sm Builds/WebGL | cut -f1); echo "uncompressed WebGL build folder: ${total} MB"
          [ "$total" -le 120 ] || { echo "::error::build is ${total} MB, over the 120 MB desktop budget"; exit 1; }
          [ "$total" -le 80 ] || echo "::warning::build is ${total} MB, over the 80 MB mobile budget (informational until a mobile target exists)"
      - name: Install Playwright + Chromium
        run: |
          npm install --no-save playwright@1.49.1 pngjs@7.0.0
          npx playwright install --with-deps chromium
      - name: Load the build in headless Chromium (software WebGL2) and check it renders
        env:
          EXPECT_BACKEND: ${{ secrets.SUPABASE_ANON_KEY != '' && '1' || '' }}   # when the anon key exists the build must have been configured with it
        run: node tools/webgl-smoke.js Builds/WebGL webgl-smoke.png
      - name: Drive scenario (?smoke=drive) - the truck must land on real ground, accelerate and move
        if: always()
        run: node tools/webgl-drive.js Builds/WebGL webgl-drive
      - name: Drive scenario at Medium quality (calibration - the game-clock windows must give the same driving at a different frame rate; informational)
        if: always()
        continue-on-error: true
        env: { DRIVE_QUERY: "&quality=medium" }
        run: node tools/webgl-drive.js Builds/WebGL webgl-drive-medium
      - name: Install PostgREST
        if: always()
        run: tools/e2e/install_postgrest.sh
      - name: Browser end-to-end on a real backend - sign-in, dashboard data from the database, notifications, presence, job accept, failure + retry states, session expiry
        if: always()
        run: |
          E2E_BUILD_DIR="$PWD/Builds/WebGL" tools/e2e/up.sh
          source /tmp/aro-e2e.env
          node tools/webgl-e2e.js webgl-e2e
      - name: Click-versus-rebuild probe (informational - what happens to a click pressed before and released after the Garage rebuilds its widgets; never fails the job)
        if: always()
        continue-on-error: true
        run: |
          source /tmp/aro-e2e.env
          node tools/webgl-click-race.js webgl-click-race
      - name: Backend logs
        if: failure()
        run: tail -n 60 /tmp/aro-e2e-postgrest.log /tmp/aro-e2e-shim.log || true
      - name: World map scenario (?smoke=worldmap) - artwork, aspect ratio, zoom, pan, cities, routes, Back/Escape
        if: always()
        run: node tools/webgl-worldmap.js Builds/WebGL webgl-worldmap
      - uses: actions/upload-artifact@v4
        if: always() && vars.ASSETS_REPO == ''
        with: { name: webgl-smoke-screenshot, path: "webgl-*.png", if-no-files-found: ignore }
      - name: Publish screenshots to the ci-screenshots branch (reviewable without downloading artifacts)
        if: always() && github.event_name == 'push' && vars.ASSETS_REPO == ''
        run: |
          mkdir -p /tmp/shots && cp webgl-*.png /tmp/shots/ 2>/dev/null || true
          cd /tmp/shots
          echo "run ${{ github.run_id }} commit ${{ github.sha }}" > README.txt
          git init -q && git checkout -q -b ci-screenshots
          git config user.name "ci" && git config user.email "ci@users.noreply.github.com"
          git add -A && git commit -qm "screenshots for ${{ github.sha }}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ci-screenshots

  lighting:
    name: Lighting at four hours (screenshots + measured brightness)
    needs: unity
    runs-on: ubuntu-latest
    if: ${{ vars.UNITY_CI_ENABLED == 'true' }}
    permissions: { contents: write }   # only to publish the screenshots to the ci-lighting branch
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: webgl-build, path: Builds/WebGL }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Install Playwright + Chromium
        run: |
          npm install --no-save playwright@1.49.1 pngjs@7.0.0
          npx playwright install --with-deps chromium
      - name: Self-test of the brightness measuring code
        run: node tools/webgl-lighting.js --selftest
      - name: Lighting scenario - dawn, noon, sunset and night by ?hour=, with the game's own [Render] and [Light] lines and measured brightness
        run: node tools/webgl-lighting.js Builds/WebGL webgl-light
      - name: Lighting scenario, Medium quality (colour grade and vignette active; informational, a failure here is reported but does not hide the Low result above)
        if: always()
        continue-on-error: true
        run: node tools/webgl-lighting.js Builds/WebGL webgl-light-medium medium
      - name: Tonemap study, Low quality with ACES (what the renderer drew before the default changed; informational)
        if: always()
        continue-on-error: true
        run: node tools/webgl-lighting.js Builds/WebGL webgl-light-aces low "&tonemap=aces"
      - name: Tonemap study, Low quality with no tonemapper (informational)
        if: always()
        continue-on-error: true
        run: node tools/webgl-lighting.js Builds/WebGL webgl-light-none low "&tonemap=none"
      - name: Sky study - dawn and sunset at four sky thicknesses (frames and colour samples to choose the setting from; informational)
        if: always()
        continue-on-error: true
        run: |
          for a in 1.0 1.25 1.5 1.75; do
            LIGHT_ONLY=dawn,sunset node tools/webgl-lighting.js Builds/WebGL "webgl-light-sky-atm$a" low "&atm=$a"
          done
      - name: Medium study - what makes Medium darker than Low (grade contrast, vignette, shadows, one at a time; informational)
        if: always()
        continue-on-error: true
        run: |
          node tools/webgl-lighting.js Builds/WebGL webgl-light-medium-c0 medium "&contrast=0" || true
          node tools/webgl-lighting.js Builds/WebGL webgl-light-medium-v0 medium "&vignette=0" || true
          node tools/webgl-lighting.js Builds/WebGL webgl-light-medium-c0v0 medium "&contrast=0&vignette=0" || true
          node tools/webgl-lighting.js Builds/WebGL webgl-light-medium-ns medium "&shadows=off" || true
      - name: Medium vignette study - 0.10 and 0.08 instead of 0.22, judged against criteria written down beforehand (informational; docs/REALISM_AUDIT.md Appendix C)
        if: always()
        continue-on-error: true
        run: |
          node tools/webgl-lighting.js Builds/WebGL webgl-light-medium-v10 medium "&vignette=0.1" || true
          node tools/webgl-lighting.js --vignette-verdict webgl-light-metrics.json webgl-light-medium-metrics.json webgl-light-medium-v10-metrics.json
          node tools/webgl-lighting.js Builds/WebGL webgl-light-medium-v08 medium "&vignette=0.08" || true
          node tools/webgl-lighting.js --vignette-verdict webgl-light-metrics.json webgl-light-medium-metrics.json webgl-light-medium-v08-metrics.json
      - name: Gradient sky study - the retuned gradient at four hours and two mid-stop variants at dawn and sunset (checks the model's predictions), plus a repeat of the procedural sky as the noise floor (informational; Appendix C)
        if: always()
        continue-on-error: true
        run: |
          LIGHT_ONLY=dawn,sunset node tools/webgl-lighting.js Builds/WebGL webgl-light-ctl low || true
          node tools/webgl-lighting.js --noise webgl-light-metrics.json webgl-light-ctl-metrics.json
          node tools/webgl-lighting.js Builds/WebGL webgl-light-grad low "&sky=gradient" || true
          LIGHT_ONLY=dawn,sunset node tools/webgl-lighting.js Builds/WebGL webgl-light-grad-m16 low "&sky=gradient&skymid=0.16" || true
          LIGHT_ONLY=dawn,sunset node tools/webgl-lighting.js Builds/WebGL webgl-light-grad-m28 low "&sky=gradient&skymid=0.28" || true
          for v in grad grad-m16 grad-m28; do echo "=== sky verdict: $v"; node tools/webgl-lighting.js --sky-verdict webgl-light-metrics.json webgl-light-$v-metrics.json 2>&1 || true; done
      - name: Is post-processing really drawn? (Medium corners must be darker than Low corners at the same hour; informational)
        if: always()
        continue-on-error: true
        run: node tools/webgl-lighting.js --compare webgl-light-metrics.json webgl-light-medium-metrics.json
      - uses: actions/upload-artifact@v4
        if: always() && vars.ASSETS_REPO == ''
        with: { name: webgl-lighting, path: "webgl-light-*", if-no-files-found: ignore }
      - name: Publish the lighting screenshots to the ci-lighting branch (reviewable without downloading artifacts)
        if: always() && github.event_name == 'push' && vars.ASSETS_REPO == ''
        run: |
          mkdir -p /tmp/lightshots && cp webgl-light-* /tmp/lightshots/ 2>/dev/null || true
          cd /tmp/lightshots
          echo "run ${{ github.run_id }} commit ${{ github.sha }}" > README.txt
          git init -q && git checkout -q -b ci-lighting
          git config user.name "ci" && git config user.email "ci@users.noreply.github.com"
          git add -A && git commit -qm "lighting screenshots for ${{ github.sha }}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ci-lighting
