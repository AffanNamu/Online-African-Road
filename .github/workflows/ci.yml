name: CI
on:
  push: { branches: ['**'] }
  pull_request:

jobs:
  sql:
    name: Database migrations + rule tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env: { POSTGRES_PASSWORD: postgres }
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env: { PGHOST: localhost, PGUSER: postgres, PGPASSWORD: postgres }
    steps:
      - uses: actions/checkout@v4
      - name: Rule, security-matrix and concurrency tests
        run: ./supabase/tests/run.sh
      - name: Mutation test (every protection must be caught by a test)
        run: python3 supabase/tests/mutation.py

  unity:
    name: Unity tests + WebGL build
    runs-on: ubuntu-latest
    # Needs repository secrets UNITY_LICENSE, UNITY_EMAIL, UNITY_PASSWORD (see docs/BUILD.md).
    if: ${{ vars.UNITY_CI_ENABLED == 'true' }}
    steps:
      - uses: actions/checkout@v4
        with: { lfs: true }
      - uses: actions/cache@v4
        with:
          path: Library
          key: Library-${{ hashFiles('Packages/manifest.json', 'ProjectSettings/ProjectVersion.txt') }}
      - uses: game-ci/unity-test-runner@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with: { testMode: editmode }
      - uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          targetPlatform: WebGL
          buildMethod: ARO.Editor.BuildScript.BuildWebGL
      - uses: actions/upload-artifact@v4
        with: { name: webgl-build, path: build/WebGL }
