# Does a model made by the Blender toolchain import into the real Unity 6 project the way the game needs it?
# CI generates a deliberately asymmetric calibration model with tools/blender (headless Blender), puts it where Unity imports from (Assets/ThirdParty/ARO_Calibration: git-ignored, never committed,
# and removed again when the job ends), and the EditMode tests in Assets/_Project/Tests/EditMode/BlenderAssetImportTests.cs measure what Unity imported: orientation, mirroring, scale, stray rotations,
# materials, the collision box, LOD triangle counts against the prop catalogue's rules. glTFast is added to the CI copy of Packages/manifest.json only (GLB needs an importer); the committed manifest is untouched.
# This is the same seam the private asset repository will use: files appear under Assets/ThirdParty at CI time and are not part of the public repository.
name: Blender import into Unity
on:
  workflow_dispatch:
  push:
    paths:
      - 'tools/blender/**'
      - 'Assets/_Project/Scripts/Editor/BlenderImport/**'
      - 'Assets/_Project/Scripts/NetCore/PropPrefabPlan.cs'
      - 'Assets/_Project/Tests/EditMode/BlenderAssetImportTests.cs'
      - '.github/workflows/blender-unity.yml'
jobs:
  import:
    name: FBX and GLB import test in Unity 6
    runs-on: ubuntu-latest
    if: ${{ vars.UNITY_CI_ENABLED == 'true' }}
    concurrency: { group: unity-license, cancel-in-progress: false }      # one Unity activation at a time, shared with the main CI job
    permissions: { contents: read, checks: write }
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.13' }
      - name: Install Blender (the bpy wheel) and the MCP SDK
        run: pip install --no-input -r tools/blender/requirements.txt
      - name: Generate the calibration model with the toolchain (FBX in 8 export-setting variants, GLB, manifest)
        run: python tools/blender/make_fixtures.py --out Assets/ThirdParty/ARO_Calibration --require-glb
      - name: Add glTFast to THIS job's manifest only (the committed Packages/manifest.json is not changed)
        run: |
          python3 - <<'PY'
          import json
          p = "Packages/manifest.json"; m = json.load(open(p))
          m["dependencies"]["com.unity.cloud.gltfast"] = "6.11.0"
          json.dump(m, open(p, "w"), indent=2)
          print("glTFast added to the CI copy of the manifest")
          PY
      - name: Derive Unity serial from the license file (masked)
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
        run: |
          python3 - <<'PY'
          import os, re, base64
          lic = os.environ["UNITY_LICENSE"]
          m = re.search(r'DeveloperData Value="([^"]+)"', lic)
          serial = ""
          if m:
              s = re.search(rb"[A-Za-z0-9]{2}(?:-[A-Za-z0-9]{4}){5}", base64.b64decode(m.group(1)))
              if s: serial = s.group(0).decode()
          if not serial: raise SystemExit("UNITY_LICENSE has no serial-backed DeveloperData; see docs/BUILD.md")
          print("::add-mask::" + serial); print("::add-mask::" + serial[:-5])
          with open(os.environ["GITHUB_ENV"], "a") as f: f.write("UNITY_SERIAL=" + serial + "\n")
          PY
      - name: Docker Hub login (optional)
        env: { DH_USER: "${{ secrets.DOCKERHUB_USERNAME }}", DH_TOKEN: "${{ secrets.DOCKERHUB_TOKEN }}" }
        run: |
          if [ -n "$DH_USER" ] && [ -n "$DH_TOKEN" ]; then echo "$DH_TOKEN" | docker login -u "$DH_USER" --password-stdin; else echo "no Docker Hub credentials; using anonymous pulls"; fi
      - name: Pre-pull the Unity editor image (retry with backoff)
        run: |
          img=unityci/editor:ubuntu-6000.0.58f2-base-3; ok=0
          for i in 1 2 3 4 5 6 7 8; do
            if docker pull "$img"; then ok=1; break; fi
            echo "pull of $img failed (attempt $i); sleeping $((i*30))s"; sleep $((i*30))
          done
          [ "$ok" = 1 ] || { echo "could not pull $img after retries"; exit 1; }
      - uses: actions/cache@v4
        with:
          path: Library
          key: Library-blender-import-${{ hashFiles('Packages/manifest.json', 'ProjectSettings/ProjectVersion.txt') }}
      - uses: game-ci/unity-test-runner@v4
        id: tests
        env:
          UNITY_SERIAL: ${{ env.UNITY_SERIAL }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          testMode: editmode
          customParameters: -testFilter ARO.Tests.BlenderAssetImportTests
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: blender-import-results, path: "${{ steps.tests.outputs.artifactsPath }}", if-no-files-found: warn }
      - name: Remove the generated fixture (it is never part of a build or of the repository)
        if: always()
        run: rm -rf Assets/ThirdParty/ARO_Calibration Assets/ThirdParty/ARO_Calibration.meta
