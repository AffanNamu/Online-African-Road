# Does a model made by the Blender toolchain import into the real Unity 6 project the way the game needs it?
# CI generates a deliberately asymmetric calibration model with tools/blender (headless Blender), puts it where Unity imports from (Assets/ThirdParty/ARO_Calibration: git-ignored, never committed,
# and removed again when the job ends), and the EditMode tests in Assets/_Project/Tests/EditMode/BlenderAssetImportTests.cs measure what Unity imported: orientation, mirroring, scale, stray rotations,
# materials, the collision box, LOD triangle counts against the prop catalogue's rules. glTFast is added to the CI copy of Packages/manifest.json only (GLB needs an importer); the committed manifest is untouched.
# This is the same seam the private asset repository will use: files appear under Assets/ThirdParty at CI time and are not part of the public repository.
# REVIEW (only when the commit message contains [kano-review], or a manual run sets review): after the import tests the job also builds the 14 residential kit assets FROM THE CODE with the toolchain (validated),
# stages them under Assets/ThirdParty/ARO, builds the game with ARO.Editor.BuildScript.BuildKanoReviewWebGL (no backend is baked in: no -supabaseUrl/-supabaseAnonKey, nothing live is touched), drives the WebGL
# build in headless Chromium (?smoke=kanostreet) and keeps the screenshots as an artifact (default 7 days; the manual input retention_days overrides it). The assets exist only inside the job; no picture or build is
# written to the log or uploaded beyond that artifact. Since 2026-11-09 the review also builds the 78 assets of the TRANSPORT KIT (tools/blender/transport_kit, families A, B, C, D, E mosques, F city buildings) in a separate workspace, stages them with
# six review scenes (logistics yard, bus terminal, road furniture lineup, roundabout kit, mosque family, city row: env_*_dry placement files of the same format as the environmental scenes) and takes 24 more pictures of them; then tools/webgl-kanocity.js drives the two Kano CITY test routes (ng-kano-city-e1, ng-kano-city-f1) in the built game and takes the pictures of the frontage engine's buildings along driven roads (kanocity-sheet.png and kanocity-report.json in the same artifact). The review also builds the five merged-frontage PROTOTYPE assets (kano_kit/frontage.py, a content-side draw-call experiment; the frozen v002 assets are
# unchanged) and shows the street with them as the "merged" variant, and the game's own draw-call numbers are split into kit and rest (KanoReviewStats).
name: Blender import into Unity
on:
  workflow_dispatch:
    inputs:
      review: { description: "also build the real Kano residential kit and show it in the running game (the same as a [kano-review] commit)", type: boolean, default: false }
      kit: { description: "which residential kit the review builds from the code: v3 (default) or v2 (the frozen candidate; a commit message with [kano-review-v2] does the same)", type: string, default: "v3" }
      env_kit: { description: "which environmental kit the review shows: e4 (default: E3 plus the six corrections of batch E4, env_kit/e4.py) or e3 (the frozen E1 to E3 kit as reviewed on 2026-11-07)", type: string, default: "e4" }
      retention_days: { description: "days the review artifact (screenshots and summary) is kept", type: string, default: "7" }
  push:
    paths:
      - 'tools/blender/**'
      - 'Assets/_Project/Scripts/Editor/BlenderImport/**'
      - 'Assets/_Project/Scripts/World/KanoReviewScene.cs'
      - 'Assets/_Project/Scripts/World/KanoReviewStats.cs'
      - 'Assets/_Project/Scripts/NetCore/DrawBreakdown.cs'
      - 'tools/webgl-kanoreview.js'
      - 'docs/kano/KANO_RESIDENTIAL_v003.freeze.json'
      - 'Assets/_Project/Scripts/NetCore/PropPrefabPlan.cs'
      - 'Assets/_Project/Tests/EditMode/BlenderAssetImportTests.cs'
      - '.github/workflows/blender-unity.yml'
jobs:
  import:
    name: FBX and GLB import test in Unity 6
    runs-on: ubuntu-latest
    if: ${{ vars.UNITY_CI_ENABLED == 'true' }}
    concurrency: { group: unity-license, cancel-in-progress: false }      # one Unity activation at a time, shared with the main CI job
    permissions: { contents: read, checks: write }
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Review gate (a [kano-review] commit message, or a manual run with review set)
        id: gate
        env: { MSG: "${{ github.event.head_commit.message }}", MANUAL: "${{ inputs.review }}", KIT: "${{ inputs.kit }}", ENVKIT: "${{ inputs.env_kit }}" }
        run: |
          kit=v3; [ "$KIT" = "v2" ] && kit=v2; case "$MSG" in *"[kano-review-v2]"*) kit=v2;; esac; echo "kit=$kit" >> "$GITHUB_OUTPUT"
          envkit=e4; [ "$ENVKIT" = "e3" ] && envkit=e3; echo "env_kit=$envkit" >> "$GITHUB_OUTPUT"
          case "$MSG" in *"[kano-review]"*|*"[kano-review-v2]"*) echo "on=true" >> "$GITHUB_OUTPUT";; *) if [ "$MANUAL" = "true" ]; then echo "on=true" >> "$GITHUB_OUTPUT"; else echo "on=false" >> "$GITHUB_OUTPUT"; fi;; esac
      - uses: actions/setup-python@v5
        with: { python-version: '3.13' }
      - name: Install Blender (the bpy wheel) and the MCP SDK
        run: pip install --no-input -r tools/blender/requirements.txt
      - name: Generate the calibration model with the toolchain (FBX in 8 export-setting variants, GLB, manifest)
        run: python tools/blender/make_fixtures.py --out Assets/ThirdParty/ARO_Calibration --require-glb
      - name: Generate the generic kit fixture (textured and cutout materials, LODs, collision; no design in it)
        run: python tools/blender/make_kit_fixture.py --out Assets/ThirdParty/ARO_KitFixture
      - name: Add glTFast to THIS job's manifest only (the committed Packages/manifest.json is not changed)
        run: |
          python3 - <<'PY'
          import json
          p = "Packages/manifest.json"; m = json.load(open(p))
          m["dependencies"]["com.unity.cloud.gltfast"] = "6.11.0"
          json.dump(m, open(p, "w"), indent=2)
          print("glTFast added to the CI copy of the manifest")
          PY
      - name: Derive Unity serial from the license file (masked)
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
        run: |
          python3 - <<'PY'
          import os, re, base64
          lic = os.environ["UNITY_LICENSE"]
          m = re.search(r'DeveloperData Value="([^"]+)"', lic)
          serial = ""
          if m:
              s = re.search(rb"[A-Za-z0-9]{2}(?:-[A-Za-z0-9]{4}){5}", base64.b64decode(m.group(1)))
              if s: serial = s.group(0).decode()
          if not serial: raise SystemExit("UNITY_LICENSE has no serial-backed DeveloperData; see docs/BUILD.md")
          print("::add-mask::" + serial); print("::add-mask::" + serial[:-5])
          with open(os.environ["GITHUB_ENV"], "a") as f: f.write("UNITY_SERIAL=" + serial + "\n")
          PY
      - name: Docker Hub login (optional)
        env: { DH_USER: "${{ secrets.DOCKERHUB_USERNAME }}", DH_TOKEN: "${{ secrets.DOCKERHUB_TOKEN }}" }
        run: |
          if [ -n "$DH_USER" ] && [ -n "$DH_TOKEN" ]; then echo "$DH_TOKEN" | docker login -u "$DH_USER" --password-stdin; else echo "no Docker Hub credentials; using anonymous pulls"; fi
      - name: Pre-pull the Unity editor image (retry with backoff)
        if: ${{ steps.gate.outputs.on != 'true' }}
        run: |
          img=unityci/editor:ubuntu-6000.0.58f2-base-3; ok=0
          for i in 1 2 3 4 5 6 7 8; do
            if docker pull "$img"; then ok=1; break; fi
            echo "pull of $img failed (attempt $i); sleeping $((i*30))s"; sleep $((i*30))
          done
          [ "$ok" = 1 ] || { echo "could not pull $img after retries"; exit 1; }
      - uses: actions/cache@v4
        with:
          path: Library
          key: Library-blender-import-${{ hashFiles('Packages/manifest.json', 'ProjectSettings/ProjectVersion.txt') }}
      - uses: game-ci/unity-test-runner@v4
        if: ${{ steps.gate.outputs.on != 'true' }}                      # a review run skips the import tests (they pass on every normal run) and goes straight to the real kit
        id: tests
        env:
          UNITY_SERIAL: ${{ env.UNITY_SERIAL }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          testMode: editmode
          customParameters: -testFilter ARO.Tests.BlenderAssetImportTests
      - uses: actions/upload-artifact@v4
        if: ${{ always() && steps.gate.outputs.on != 'true' }}
        with: { name: blender-import-results, path: "${{ steps.tests.outputs.artifactsPath }}", if-no-files-found: warn }
      # ------------------------------------------------------------------------------------------------ the real kit in the running game (opt-in)
      - name: Review - remove the test fixtures so that only the real kit is built
        if: ${{ steps.gate.outputs.on == 'true' }}
        run: sudo rm -rf Assets/ThirdParty/ARO_Calibration Assets/ThirdParty/ARO_Calibration.meta Assets/ThirdParty/ARO_KitFixture Assets/ThirdParty/ARO_KitFixture.meta Assets/ThirdParty/ARO Assets/ThirdParty/ARO.meta Builds
      - name: Review - build the residential kit assets from the code (toolchain validation must pass for every one)
        if: ${{ steps.gate.outputs.on == 'true' }}
        env: { ARO_WORKSPACE: "${{ runner.temp }}/aro-ws", PYTHONPATH: tools/blender, KIT: "${{ steps.gate.outputs.kit }}" }
        run: |
          if [ "$KIT" = "v3" ]; then
            python -m kano_kit.build3 --report "$RUNNER_TEMP/kit_report3.json"
            python3 - <<'PY'
          import json, os, sys
          r = json.load(open(os.path.join(os.environ["RUNNER_TEMP"], "kit_report3.json")))
          bad = [x["id"] for x in r if not x["passed"]]
          for x in r: print(("PASS " if x["passed"] else "FAIL ") + x["id"], x["stats"].get("lod_triangles"), "materials", len(x["stats"].get("materials", [])))
          print(f"{len(r)} v003 assets built (14 kit + 5 merged-frontage prototype); failed validation: {bad or 'none'}")
          sys.exit(1 if bad or len(r) != 19 else 0)
          PY
            echo "--- is what the review builds exactly the frozen v003? (report only; the fresh workspace labels it v001)"
            python -m kano_kit.verify_freeze --freeze docs/kano/KANO_RESIDENTIAL_v003.freeze.json --workspace "$ARO_WORKSPACE" --map v003=v001 || true
            exit 0
          fi
          python -m kano_kit.build_all --report "$RUNNER_TEMP/kit_report.json"
          python3 - <<'PY'
          import json, os, sys
          r = json.load(open(os.path.join(os.environ["RUNNER_TEMP"], "kit_report.json")))
          bad = [x["id"] for x in r if not x["passed"]]
          for x in r: print(("PASS " if x["passed"] else "FAIL ") + x["id"], x["stats"].get("lod_triangles"))
          print(f"{len(r)} assets built; failed validation: {bad or 'none'}")
          sys.exit(1 if bad or len(r) != 14 else 0)
          PY
          # the merged-frontage prototype (new assets; the 14 above are the frozen v002 code and are not changed by it)
          python -m kano_kit.frontage --report "$RUNNER_TEMP/frontage_report.json"
          python3 - <<'PY'
          import json, os, sys
          r = json.load(open(os.path.join(os.environ["RUNNER_TEMP"], "frontage_report.json")))
          bad = [x["id"] for x in r if not x["passed"]]
          for x in r: print(("PASS " if x["passed"] else "FAIL ") + x["id"], x["stats"].get("lod_triangles"))
          print(f"{len(r)} prototype assets built; failed validation: {bad or 'none'}")
          sys.exit(1 if bad or len(r) != 5 else 0)
          PY
      - name: Review - build the 26 environmental kit assets from the code (toolchain validation must pass for every one)
        if: ${{ steps.gate.outputs.on == 'true' }}
        env: { ARO_WORKSPACE: "${{ runner.temp }}/aro-ws", PYTHONPATH: tools/blender }
        run: |
          python -m env_kit.build_env --report "$RUNNER_TEMP/env_report.json"
          python3 - <<'PY'
          import json, os, sys
          r = json.load(open(os.path.join(os.environ["RUNNER_TEMP"], "env_report.json")))
          bad = [x["id"] for x in r if not x["passed"]]
          for x in r: print(("PASS " if x["passed"] else "FAIL ") + x["id"], x["stats"].get("lod_triangles"), "materials", len(x["stats"].get("materials", [])))
          print(f"{len(r)} environmental assets built; failed validation: {bad or 'none'}")
          sys.exit(1 if bad or len(r) != 26 else 0)
          PY
      - name: Review - build the six corrections of batch E4 as the next version of their assets (potholes, mud ruts, flood sheet, three Hausa assets; toolchain validation must pass for every one)
        if: ${{ steps.gate.outputs.on == 'true' && steps.gate.outputs.env_kit == 'e4' }}
        env: { ARO_WORKSPACE: "${{ runner.temp }}/aro-ws", PYTHONPATH: tools/blender }
        run: |
          python -m env_kit.build_e4 --report "$RUNNER_TEMP/e4_report.json"
          python3 - <<'PY'
          import json, os, sys
          r = json.load(open(os.path.join(os.environ["RUNNER_TEMP"], "e4_report.json")))
          bad = [x["id"] for x in r if not x["passed"]]
          for x in r: print(("PASS " if x["passed"] else "FAIL ") + x["id"], x["stats"].get("lod_triangles"), "materials", len(x["stats"].get("materials", [])))
          print(f"{len(r)} E4 assets built; failed validation: {bad or 'none'}")
          sys.exit(1 if bad or len(r) != 6 else 0)
          PY
      - name: Review - build the transport kit (families A logistics, B bus terminals, C road furniture, D roundabout and flyover components, E mosques, F city buildings, G fuel stations, H commercial, I public, J residential; 106 assets) FROM THE CODE in its own workspace (toolchain validation and the 4-material cap must pass for every one)
        if: ${{ steps.gate.outputs.on == 'true' }}
        env: { ARO_WORKSPACE: "${{ runner.temp }}/aro-ws-tk", PYTHONPATH: tools/blender }
        run: |
          python -m transport_kit.build_transport --report "$RUNNER_TEMP/tk_report.json"
          python3 - <<'PY'
          import json, os, sys
          r = json.load(open(os.path.join(os.environ["RUNNER_TEMP"], "tk_report.json")))
          bad = [x["id"] for x in r if not x["passed"]]
          for x in r: print(("PASS " if x["passed"] else "FAIL ") + x["id"], x["stats"].get("lod_triangles"), "materials", len(x["stats"].get("materials", [])))
          print(f"{len(r)} transport-kit assets built; failed validation: {bad or 'none'}")
          sys.exit(1 if bad or len(r) != 106 else 0)
          PY
      - name: Review - stage the exports where the game's editor code looks for them (Assets/ThirdParty is git-ignored)
        if: ${{ steps.gate.outputs.on == 'true' }}
        env: { ARO_WORKSPACE: "${{ runner.temp }}/aro-ws", PYTHONPATH: tools/blender, ARO_ENV_KIT: "${{ steps.gate.outputs.env_kit }}" }
        run: python -m kano_kit.stage_unity --out Assets/ThirdParty/ARO
      - name: Review - stage the transport kit and its ten review scenes (logistics yard, bus terminal, road furniture, roundabout kit, mosque family, city row, fuel stations, commerce, civic, homes) next to the other kits (the material lists are merged, nothing staged is replaced)
        if: ${{ steps.gate.outputs.on == 'true' }}
        env: { ARO_WORKSPACE: "${{ runner.temp }}/aro-ws-tk", PYTHONPATH: tools/blender }
        run: python -m transport_kit.stage_unity --out Assets/ThirdParty/ARO
      - name: Review - pre-pull the Unity WebGL editor image (retry with backoff)
        if: ${{ steps.gate.outputs.on == 'true' }}
        run: |
          img=unityci/editor:ubuntu-6000.0.58f2-webgl-3; ok=0
          for i in 1 2 3 4 5 6 7 8; do if docker pull "$img"; then ok=1; break; fi; echo "pull of $img failed (attempt $i); sleeping $((i*30))s"; sleep $((i*30)); done
          [ "$ok" = 1 ] || { echo "could not pull $img after retries"; exit 1; }
      - name: Review - build the game with the real kit (BuildKanoReviewWebGL; no backend is baked in)
        if: ${{ steps.gate.outputs.on == 'true' }}
        uses: game-ci/unity-builder@v4
        env:
          UNITY_SERIAL: ${{ env.UNITY_SERIAL }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          targetPlatform: WebGL
          buildMethod: ARO.Editor.BuildScript.BuildKanoReviewWebGL
          versioning: None
      - uses: actions/setup-node@v4
        if: ${{ steps.gate.outputs.on == 'true' }}
        with: { node-version: 22 }
      - name: Review - install Playwright and Chromium
        if: ${{ steps.gate.outputs.on == 'true' }}
        run: |
          npm install --no-save playwright@1.49.1 pngjs@7.0.0
          npx playwright install --with-deps chromium
      - name: Review - drive the built game and take one screenshot per view (the numbers come from the game's own [Perf] lines)
        if: ${{ steps.gate.outputs.on == 'true' }}
        run: |
          sudo chown -R "$USER" Builds || true; mkdir -p kano-review
          echo "WebGL build size (E0): $(du -sm Builds/WebGL | cut -f1) MB on disk"; ls -l Builds/WebGL/Build | awk '{print $5, $9}'
          node tools/webgl-kanoreview.js Builds/WebGL "$GITHUB_WORKSPACE/kano-review/kanoreview" "ref,front,side,street1,street2,top,ref:merged,street1:merged,side:merged,street2:merged,ref:noshadow,ref:shadowsmall,ref:low,street1:low,drive@env_hausa_quarter_dry,aerial@env_hausa_quarter_dry,drive@env_hausa_quarter_wet,aerial@env_hausa_quarter_wet,drive@env_village_dry,aerial@env_village_dry,drive@env_village_wet,aerial@env_village_wet,drive@env_market_street_dry,aerial@env_market_street_dry,drive@env_market_street_wet,aerial@env_market_street_wet,wall@env_hausa_quarter_dry,wall@env_hausa_quarter_wet,ruts@env_hausa_quarter_wet,ruts@env_village_dry,ruts@env_village_wet,potholes@env_market_street_dry,potholes@env_market_street_wet,flood@env_market_street_wet,drive@env_logistics_yard_dry,aerial@env_logistics_yard_dry,docks@env_logistics_yard_dry,yard@env_logistics_yard_dry,drive@env_bus_terminal_dry,aerial@env_bus_terminal_dry,front@env_bus_terminal_dry,close@env_bus_terminal_dry,front@env_road_furniture_dry,aerial@env_road_furniture_dry,signs@env_road_furniture_dry,lights@env_road_furniture_dry,front@env_roundabout_kit_dry,aerial@env_roundabout_kit_dry,kit@env_roundabout_kit_dry,flyover@env_roundabout_kit_dry,front@env_kano_mosques_dry,aerial@env_kano_mosques_dry,grand@env_kano_mosques_dry,small@env_kano_mosques_dry,drive@env_kano_city_row_dry,aerial@env_kano_city_row_dry,mosque@env_kano_city_row_dry,monument@env_kano_city_row_dry,drive@env_kano_fuel_dry,aerial@env_kano_fuel_dry,large@env_kano_fuel_dry,small@env_kano_fuel_dry,drive@env_kano_commerce_dry,aerial@env_kano_commerce_dry,hotel@env_kano_commerce_dry,shops@env_kano_commerce_dry,drive@env_kano_civic_dry,aerial@env_kano_civic_dry,hospital@env_kano_civic_dry,school@env_kano_civic_dry,drive@env_kano_homes_dry,aerial@env_kano_homes_dry,mansion@env_kano_homes_dry,lowcost@env_kano_homes_dry" || { echo "review script reported failures"; exit 1; }
        shell: bash {0}
      - name: Review - the Kano city routes in the running game (frontage engine buildings and mosques along driven roads - single carriageway, commercial road, residential street, arterial, the flyover from the cab in both directions, wide density views)
        if: ${{ steps.gate.outputs.on == 'true' }}
        run: |
          node tools/webgl-kanocity.js --selftest
          node tools/webgl-kanocity.js Builds/WebGL "$GITHUB_WORKSPACE/kano-review/kanocity" low || { echo "city script reported failures"; exit 1; }
        shell: bash {0}
      - name: Review - refuel at a pump with the real station models (P1; the truck beside the first pump of both Kano city routes; no backend in this build, so the offline notice and no fuel added; informational until two runs agree)
        if: ${{ steps.gate.outputs.on == 'true' }}
        continue-on-error: true
        run: node tools/webgl-pump.js Builds/WebGL "$GITHUB_WORKSPACE/kano-review/pump" ng-kano-city-e1 ng-kano-city-f1
        shell: bash {0}
      - name: Review - the numbers (no pictures are written to this public log)
        if: ${{ always() && steps.gate.outputs.on == 'true' }}
        run: |
          mkdir -p kano-review; [ -f kano-review/kanoreview-summary.json ] && python3 -c "import json;d=json.load(open('kano-review/kanoreview-summary.json'));[print(k, json.dumps({x:y for x,y in v.items() if x!='render'})) for k,v in d.items()]" || echo "no summary was written"
          ls -la kano-review || true
      - uses: actions/upload-artifact@v4
        if: ${{ always() && steps.gate.outputs.on == 'true' }}
        with: { name: kano-review-in-game, path: kano-review, retention-days: "${{ inputs.retention_days || 7 }}", if-no-files-found: warn }
      - name: Remove the generated fixture (it is never part of a build or of the repository)
        if: always()
        # The Unity container runs as root and writes the kit materials it creates into the
        # workspace, so a plain rm fails with "Permission denied" (seen on run 41259509027,
        # after all four import tests had passed).
        run: sudo rm -rf Assets/ThirdParty/ARO_Calibration Assets/ThirdParty/ARO_Calibration.meta Assets/ThirdParty/ARO_KitFixture Assets/ThirdParty/ARO_KitFixture.meta Assets/ThirdParty/ARO Assets/ThirdParty/ARO.meta Builds
